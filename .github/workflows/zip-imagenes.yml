name: ZIP imagenes abstractas
on:
  push:
    branches: [claude/imagenes-zip]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir imagenes-abstractas
          while IFS='|' read -r src name; do cp "$src" "imagenes-abstractas/$name"; done < .github/imagenes.txt
          ls imagenes-abstractas | wc -l
          zip -r imagenes-abstractas.zip imagenes-abstractas
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create imagenes-abstractas imagenes-abstractas.zip \
            --target "${{ github.sha }}" \
            --title "Imagenes abstractas (130)" \
            --notes "Las 130 imagenes abstractas generadas con Artlist que sustituyen a las imagenes con texto de la web."
