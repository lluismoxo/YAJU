name: Replace text images with abstract versions

on:
  push:
    branches: [claude/encaje-imagenes]
    paths:
      - tools/image-replacements.csv
      - tools/replace_images.py
      - .github/workflows/replace-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pillow>=11,<12"
      - run: python tools/replace_images.py
      - name: Commit replaced images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Regenerate 27 images to match their page background"
            git push
          fi
